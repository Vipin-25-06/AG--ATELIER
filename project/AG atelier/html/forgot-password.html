<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AG ATELIER</title>
  <meta name="description" content="Reset your AG ATELIER account password. Enter your email and new password to regain access." />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/preloader.css" />
  <script src="../assets/js/preloader.js"></script>
  <script src="../assets/js/auth.js"></script>
</head>
<body>
  <div id="logged-in"></div>

  <!-- ═══════════════════════════════════════════════
       PRELOADER OVERLAY (Pure CSS Progress Bar 0% - 100%)
       Matches AG ATELIER UI/UX palette
       ═══════════════════════════════════════════════ -->
  <div class="site-preloader" id="site-preloader" aria-label="Loading AG ATELIER">
    <div class="preloader-brand">AG ATELIER</div>
    <div class="preloader-progress-track">
      <div class="preloader-progress-bar"></div>
    </div>
    <div class="preloader-percentage">Loading Website: </div>
  </div>


  <main id="main-content" class="auth-page">

    <div class="auth-card" id="forgot-password-card">

      <div style="text-align:center; margin-bottom: var(--space-3)">
        <a href="index.html" style="font-family:var(--font-heading); font-size:1.25rem;
          font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-onyx)">
          AG ATELIER
        </a>
      </div>

      <h1 class="auth-title" id="forgot-title">Reset Password</h1>
      <p class="auth-subtitle" id="forgot-subtitle">
        Enter your email, choose a new password, and confirm with the security code.
      </p>

      <!-- Forgot Password form
           HTML5 native validation via required, type, minlength, pattern.
           action='#' — Evaluation 2 JS handles this. -->
      <form class="auth-form" id="forgot-form" action="login.html" method="get" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email Address</label>
          <input
            class="form-input" type="email" id="forgot-email" name="email"
            placeholder="you@example.com" required
            title="Please enter the email address you registered with"
            aria-required="true" autocomplete="email"
          />
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label class="form-label" for="forgot-new-password">New Password</label>
          <input
            class="form-input" type="password" id="forgot-new-password" name="new-password"
            placeholder="Create a new strong password"
            required
            minlength="8"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&amp;#])[A-Za-z\d@$!%*?&amp;#]{8,}"
            title="Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character"
            aria-required="true" autocomplete="new-password"
          />
          <!-- Password strength hints -->
          <div class="password-hints" id="forgot-password-hints" role="list">
            <div class="hint-item" role="listitem" id="fp-hint-length">
              <span class="hint-icon" aria-hidden="true">○</span>At least 8 characters
            </div>
            <div class="hint-item" role="listitem" id="fp-hint-upper">
              <span class="hint-icon" aria-hidden="true">○</span>One uppercase letter
            </div>
            <div class="hint-item" role="listitem" id="fp-hint-number">
              <span class="hint-icon" aria-hidden="true">○</span>One number
            </div>
            <div class="hint-item" role="listitem" id="fp-hint-special">
              <span class="hint-icon" aria-hidden="true">○</span>One special character
            </div>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group">
          <label class="form-label" for="forgot-confirm-password">Confirm New Password</label>
          <input
            class="form-input" type="password" id="forgot-confirm-password"
            name="confirm-password"
            placeholder="Repeat your new password"
            required minlength="8"
            title="Please re-enter your new password"
            aria-required="true" autocomplete="new-password"
          />
        </div>

        <!-- CAPTCHA -->
        <div class="form-group">
          <span class="captcha-label">Security Check</span>
          <div class="captcha-box" id="captcha-box">
            <div class="captcha-code" id="captcha-code-display"
              aria-label="CAPTCHA code: P4T8X">
              <span class="captcha-text" aria-hidden="true" id="captcha-text">P4T8X</span>
            </div>
            <button type="button" class="captcha-refresh" id="captcha-refresh-btn"
              data-action="refresh-captcha" aria-label="Refresh CAPTCHA">↻</button>
          </div>
          <input
            class="captcha-input" type="text" id="captcha-input" name="captcha"
            placeholder="Type the code above" required autocomplete="off"
            aria-label="Enter the CAPTCHA code shown above"
          />
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-auth-submit" id="btn-reset-submit">
          Reset Password →
        </button>

      </form>

      <p class="auth-redirect" id="forgot-redirect">
        Remember your password?
        <a href="login.html" id="link-back-login">Sign in</a>
      </p>

      <a href="index.html" class="auth-back-home" id="link-back-home">
        ← Back to Home
      </a>

    </div>

  </main>

</body>
</html>
