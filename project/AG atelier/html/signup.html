<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — AG ATELIER</title>
  <meta name="description" content="Create your AG ATELIER account. Get early access to new arrivals, track orders, and manage your wishlist." />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/css/preloader.css" />
  <script src="../assets/js/preloader.js"></script>
  <script src="../assets/js/auth.js"></script>
</head>
<body>
  <div id="logged-in"></div>

  <!-- ═══════════════════════════════════════════════
       PRELOADER OVERLAY (Pure CSS Progress Bar 0% - 100%)
       Matches AG ATELIER UI/UX palette
       ═══════════════════════════════════════════════ -->
  <div class="site-preloader" id="site-preloader" aria-label="Loading AG ATELIER">
    <div class="preloader-brand">AG ATELIER</div>
    <div class="preloader-progress-track">
      <div class="preloader-progress-bar"></div>
    </div>
    <div class="preloader-percentage">Loading Website: </div>
  </div>


  <main id="main-content" class="auth-page">

    <div class="auth-card" id="signup-card">

      <div style="text-align:center; margin-bottom: var(--space-3)">
        <a href="index.html" style="font-family:var(--font-heading); font-size:1.25rem;
          font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-onyx)">
          AG ATELIER
        </a>
      </div>

      <h1 class="auth-title" id="signup-title">Create Account</h1>
      <p class="auth-subtitle" id="signup-subtitle">Join to enjoy exclusive member benefits.</p>

      <!-- Sign up form
           action='#' method='get' — Evaluation 2 JS intercepts this.
           HTML5 native validation via required, minlength, pattern, and type. -->
      <form class="auth-form" id="signup-form" action="index.html#logged-in" method="get" novalidate>

        <!-- Full name -->
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input
            class="form-input" type="text" id="signup-name" name="name"
            placeholder="Jane Doe" required minlength="2"
            title="Please enter your full name"
            aria-required="true" autocomplete="name"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input
            class="form-input" type="email" id="signup-email" name="email"
            placeholder="you@example.com" required
            title="Please enter a valid email address"
            aria-required="true" autocomplete="email"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input
            class="form-input" type="password" id="signup-password" name="password"
            placeholder="Create a password"
            required minlength="8"
            aria-required="true"
            autocomplete="new-password"
          />
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <input
            class="form-input" type="password" id="signup-confirm-password"
            name="confirm-password"
            placeholder="Repeat your password"
            required minlength="8"
            title="Please re-enter your password"
            aria-required="true" autocomplete="new-password"
          />
          <!-- JS NOTE: Evaluation 2 will compare this with signup-password
               and show an error message if they don't match on blur. -->
        </div>

        <!-- CAPTCHA -->
        <div class="form-group">
          <span class="captcha-label">Security Check</span>
          <div class="captcha-box" id="captcha-box">
            <div class="captcha-code" id="captcha-code-display"
              aria-label="CAPTCHA code: B9Q2M">
              <span class="captcha-text" aria-hidden="true" id="captcha-text">B9Q2M</span>
            </div>
            <button type="button" class="captcha-refresh" id="captcha-refresh-btn"
              data-action="refresh-captcha" aria-label="Refresh CAPTCHA">↻</button>
          </div>
          <input
            class="captcha-input" type="text" id="captcha-input" name="captcha"
            placeholder="Type the code above" required autocomplete="off"
            aria-label="Enter the CAPTCHA code shown above"
          />
        </div>

        <!-- Submit (changed to link for static HTML navigation) -->
        <a href="account.html#profile" class="btn-auth-submit" id="btn-signup-submit" style="display:block; text-align:center; text-decoration:none;">
          Create Account →
        </a>

      </form>

      <p class="auth-redirect" id="signup-redirect">
        Already have an account?
        <a href="login.html" id="link-to-login">Sign in</a>
      </p>

      <a href="index.html" class="auth-back-home" id="link-back-home">
        ← Back to Home
      </a>

    </div>

  </main>

</body>
</html>
